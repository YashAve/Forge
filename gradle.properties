# Memory settings - optimized for high-end system with 28 cores
org.gradle.jvmargs=-Xmx16g -Xms8g -XX:MaxMetaspaceSize=3g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -XX:MaxGCPauseMillis=200 -XX:ParallelGCThreads=14 -Dfile.encoding=UTF-8

# Build performance - maximizing CPU utilization
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000
org.gradle.workers.max=28

# Android optimizations
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
android.useFullClasspathForDexingTransform=true
android.enableResourceOptimizations=true
android.enableBuildScriptClasspathCheck=false
android.enableAppCompileTimeRClass=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true
kotlin.compiler.execution.strategy=daemon

# Compilation settings
kapt.use.worker.api=true
kapt.incremental.apt=true
kapt.include.compile.classpath=false
kapt.workers.isolation=process