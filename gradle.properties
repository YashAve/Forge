# =============================================================================
# Gradle build tuning — host: Acer Nitro AN515-52 (i5-8300H, 8 threads, 14 GiB RAM)
# Goal: fastest builds that STAY STABLE on limited RAM (swap fills fast here) and
# while the S24 Ultra emulator + Android Studio are also running.
# =============================================================================

# --- JVM / memory -----------------------------------------------------------
# 3g heap is the sweet spot: large enough to avoid GC churn, small enough that the
# Gradle daemon + Kotlin daemon + emulator + IDE don't push the box into swap (the
# #1 build-speed killer on this machine). G1 keeps GC pauses short.
org.gradle.jvmargs=-Xmx3g -Xms1g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Run Gradle on Android Studio's bundled JetBrains Runtime (JBR 21.0.8). The distro
# OpenJDK 21.0.11 on this Ubuntu 26.04 host SIGSEGVs inside R8/D8 during dexing
# (JIT miscompilation, not OOM). JBR is the AGP-recommended runtime and is stable here.
org.gradle.java.home=/home/yash/software/android-studio-otter/jbr

# --- Parallelism / daemon ---------------------------------------------------
org.gradle.daemon=true
org.gradle.parallel=true
# 6 of 8 threads for Gradle workers; leaves headroom for the IDE, emulator, system.
org.gradle.workers.max=6
# Release the idle daemon's RAM after 30 min so it stops starving the emulator.
org.gradle.daemon.idletimeout=1800000

# --- Caching: the big speedups ----------------------------------------------
# Reuse task outputs across builds and projects.
org.gradle.caching=true
# Skip configuration entirely when nothing relevant changed — the single biggest
# modern win. 'warn' lets a not-yet-compatible plugin degrade gracefully instead
# of failing the build.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# Watch the filesystem so up-to-date checks are near-instant.
org.gradle.vfs.watch=true

# --- Android ----------------------------------------------------------------
android.useAndroidX=true
android.enableJetifier=false
# Non-transitive R classes = smaller, faster R-class compilation (the real win).
# The experimental enableAppCompileTimeRClass flag was dropped: it only produced a
# build warning and is unnecessary on top of nonTransitiveRClass.
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

# --- Kotlin -----------------------------------------------------------------
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
# Cap the Kotlin compile daemon so it fits the RAM budget alongside everything else.
kotlin.daemon.jvmargs=-Xmx1536m -XX:+UseG1GC

# --- kapt (Hilt/Dagger annotation processing) -------------------------------
# Incremental + worker API keep kapt off the critical path. 'none' isolation runs
# in the Gradle worker instead of forking a fresh JVM per round — lighter and faster
# to start on this RAM budget.
kapt.incremental.apt=true
kapt.use.worker.api=true
kapt.include.compile.classpath=false
kapt.workers.isolation=none
